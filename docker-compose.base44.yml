services:
  db-init:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec node .base44/init-db.js"]
    env_file:
      - /run/base44/app.env

  web:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    command: ["node", "--watch", "server.js"]
    env_file:
      - /run/base44/app.env
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  node_modules:
