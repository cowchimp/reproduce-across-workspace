services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    # MONGODB_URI comes from the shared "mongodb" database via the platform env file.
    env_file:
      - /run/base44/app.env
    environment:
      - PORT=3000
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec node --watch server.js"]
    ports:
      - "3000:3000"
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 60s

volumes:
  node_modules:
