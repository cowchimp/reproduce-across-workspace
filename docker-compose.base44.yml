services:
  app:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app:ro
      - app-dependencies:/opt/todo-app
    command:
      - /bin/sh
      - -ec
      - |
        cp /app/package.json /app/package-lock.json /app/.npmrc /opt/todo-app/
        cd /opt/todo-app
        npm ci --omit=dev --ignore-scripts --no-audit --no-fund
        exec node /app/server.js
    environment:
      NODE_PATH: /opt/todo-app/node_modules
      npm_config_cache: /opt/todo-app/.npm
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: todos
      PGUSER: todos
      PGPASSWORD: todos-dev-password
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: todos
      POSTGRES_USER: todos
      POSTGRES_PASSWORD: todos-dev-password
    volumes:
      - todo-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todos -d todos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  todo-data:
  app-dependencies:
